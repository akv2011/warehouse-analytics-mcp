[project]
name = "warehouse-analytics-mcp"
version = "0.1.0"
description = "Read-only analytics MCP server: metric layer and guarded SQL over DuckDB"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arunkumar V", email = "arunkumarv1530@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11,<5",
    "duckdb>=1.5.6",
    "sqlglot>=30.21.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
warehouse-mcp = "warehouse_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["warehouse_mcp"]
